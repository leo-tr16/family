<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Liên kết cũ đã ngừng hoạt động — Leo Family</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #FBF7F0;
      color: #161B21;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #ECE5D8;
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 10px;
      color: #161B21;
      font-weight: 700;
    }
    p {
      font-size: 0.95rem;
      color: #6B7280;
      line-height: 1.55;
      margin: 0 0 20px;
    }
    .badge {
      display: inline-block;
      background: #FBE6E7;
      color: #B4232A;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>Đường dẫn cũ đã ngừng hoạt động</h1>
    <p>Hệ thống Leo Family Story đã được nâng cấp bảo mật và chuyển sang ứng dụng mới. Đường dẫn này không còn sử dụng được nữa.</p>
    <div class="badge">Vui lòng mở liên kết mới do Bố gửi</div>
  </div>
</body>
</html>
