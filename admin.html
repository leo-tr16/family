<head>

  <meta http-equiv="Pragma" content="no-cache">

  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">

  <title>Leo Family Story — Quản trị & Biên tập</title>
  <style>
/* ==========================================================================
   Leo Family Story — Viewer & Admin Stylesheet v2.3 (2026-11-24)
   Bản cập nhật v2.3:
   1. Admin tối giản: chỉ còn Thêm · Sửa · Đăng (bỏ các chức năng cũ không dùng).
   2. Bảng Sửa bài: Mobile = slide-up bottom sheet, Desktop = drawer 460px từ phải.
   3. Album Desktop ≥ 1024px: thẻ 2 cột (ảnh vuông trái 400px, chữ phải max 7 dòng + Xem thêm #8A5A12).
   4. Thẻ không ảnh: 1 cột max 3 dòng.
   5. Bộ lọc 1 dòng: Con (Cả nhà, Tomey, Ben, Marc, Alex, Chung) · Mọi năm ▾ · Lọc ▾ · Tìm kỷ niệm…
   6. Ảnh thu nhỏ 800px q78 (media-thumb/), PhotoSwipe mở 1920px với true width/height.
   7. Tone màu: Navy #161B21, Vàng #F4A950, Kem #F6E3C4, #8A5A12; bỏ toàn bộ teal.
   ========================================================================== */

@import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap");

:root {
  --navy: #161B21;
  --gold: #F4A950;
  --gold-ink: #8A5A12;
  --cream: #F6E3C4;
  --bg: #F7F3EC;
  --card: #ffffff;
  --line: #E7DFD1;
  --muted: #5F646B;
  --soft: #8B8F95;
  --r-lg: 16px;
  --r-md: 12px;
  --r-sm: 8px;
  --font: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-serif: "Noto Serif", Georgia, serif;

  /* Per-child accent colors */
  --c-tomey: #2F4A7A; --c-tomey-bg: #E9EEF4;
  --c-ben: #2E6B55;   --c-ben-bg: #E9F0ED;
  --c-marc: #8A5A12;  --c-marc-bg: #F5EFE1;
  --c-alex: #8E3B5B;  --c-alex-bg: #F4E8EE;
  --c-chung: #5E5A52; --c-chung-bg: #EEEDEA;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
html, body {
  overflow-x: hidden;
  max-width: 100vw;
  width: 100%;
  box-sizing: border-box;
}
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--navy);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
svg { display: block; }
a { color: inherit; }

/* --------------------------------------------------------------------------
   LAYOUT CONTAINERS
   -------------------------------------------------------------------------- */
.wrap, .app-container {
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 16px;
  box-sizing: border-box;
  overflow-x: hidden;
}

/* --------------------------------------------------------------------------
   DESKTOP ALBUM HEADER (D1)
   -------------------------------------------------------------------------- */
@media (min-width: 1024px) {
  .d-head {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    padding: 24px 0 12px;
    width: 100%;
    box-sizing: border-box;
  }
  .d-head .d-head-brand .ttl {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--navy);
  }
  .d-head .d-head-brand .sub {
    font-size: 14px;
    color: var(--muted);
    margin-top: 2px;
  }
  .d-head .stats {
    margin-left: auto;
    font-size: 14px;
    color: var(--muted);
    text-align: right;
    line-height: 1.5;
  }
  .btn-lock {
    height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--navy);
    font-size: 14px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 12px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .btn-lock:hover { background: #f0ebe2; }
}

@media (max-width: 1023px) {
  .d-head {
    display: block;
    position: relative;
    padding: 18px 0 12px;
    padding-right: 54px;
    width: 100%;
    box-sizing: border-box;
  }
  .d-head .d-head-brand .ttl {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--navy);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.25;
  }
  .d-head .d-head-brand .sub {
    display: none;
  }
  .d-head .stats {
    font-size: 14px;
    color: var(--muted);
    margin-top: 4px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn-lock {
    position: absolute;
    top: 14px;
    right: 0;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .btn-lock span {
    display: none;
  }
  .btn-lock svg {
    width: 20px;
    height: 20px;
  }
}

/* --------------------------------------------------------------------------
   1-ROW FILTER BAR (D1 & Mobile)
   -------------------------------------------------------------------------- */
@media (min-width: 1024px) {
  .d-filters {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 12px 0 !important;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
    position: relative;
    width: 100% !important;
    box-sizing: border-box;
  }
  .d-filters .kids-chips {
    display: flex !important;
    flex-direction: row !important;
    gap: 6px !important;
    align-items: center !important;
    flex-shrink: 0 !important;
  }
  .d-filters .sep {
    display: block !important;
    width: 1px !important;
    height: 24px !important;
    background: var(--line) !important;
    margin: 0 4px !important;
    flex-shrink: 0 !important;
  }
  .d-filters .mobile-controls-row {
    display: flex !important;
    flex-direction: row !important;
    gap: 6px !important;
    align-items: center !important;
    flex-shrink: 0 !important;
  }
  .d-filters .filter-dropdown-wrap {
    position: relative !important;
    flex-shrink: 0 !important;
  }
  .d-filters .search {
    margin-left: auto !important;
    min-width: 180px !important;
    max-width: 260px !important;
    flex: 1 1 auto !important;
    height: 44px !important;
  }
}

@media (max-width: 1023px) {
  .d-filters {
    display: flex !important;
    flex-direction: column !important;
    gap: 10px !important;
    padding: 10px 0 !important;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
    position: relative;
    width: 100% !important;
    box-sizing: border-box;
  }
  .d-filters .kids-chips {
    display: flex !important;
    flex-direction: row !important;
    gap: 8px !important;
    overflow-x: auto !important;
    padding-bottom: 4px !important;
    -webkit-overflow-scrolling: touch;
    width: 100% !important;
    box-sizing: border-box;
  }
  .d-filters .sep {
    display: none !important;
  }
  .d-filters .mobile-controls-row {
    display: flex !important;
    flex-direction: row !important;
    gap: 8px !important;
    align-items: center !important;
    width: 100% !important;
    box-sizing: border-box;
  }
  .d-filters .mobile-controls-row .filter-dropdown-wrap {
    flex: 1 1 50% !important;
  }
  .d-filters .mobile-controls-row .chip {
    width: 100% !important;
    justify-content: center !important;
  }
  .d-filters .search {
    width: 100% !important;
    margin-left: 0 !important;
    box-sizing: border-box !important;
  }
}
.chip {
  height: 44px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 14px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  color: var(--navy);
  text-decoration: none;
  white-space: nowrap;
}
.chip:hover { background: #fdfbf7; }
.chip.on {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}
.chip .d {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.d-filters .sep {
  width: 1px;
  height: 24px;
  background: var(--line);
  margin: 0 6px;
  flex: none;
}
.filter-dropdown-wrap {
  position: relative;
}
.dropdown-popover {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: 0 8px 24px rgba(22, 27, 33, 0.12);
  z-index: 50;
  min-width: 160px;
  max-height: 280px;
  overflow-y: auto;
  padding: 6px 0;
}
.dropdown-popover button {
  width: 100%;
  text-align: left;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--navy);
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
}
.dropdown-popover button:hover, .dropdown-popover button.active {
  background: var(--cream);
  color: var(--navy);
}
.d-filters .search {
  margin-left: auto;
  width: 260px;
  height: 44px;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  font-size: 14px;
  color: var(--soft);
}
.d-filters .search svg { width: 16px; height: 16px; }
.d-filters .search input {
  border: none;
  outline: none;
  width: 100%;
  height: 100%;
  min-height: 44px;
  font-size: 14px;
  font-family: inherit;
  color: var(--navy);
  background: transparent;
}

/* --------------------------------------------------------------------------
   TIMELINE FEED & CARDS
   -------------------------------------------------------------------------- */
.feed {
  padding: 0 0 40px;
}
.year {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 16px 0 14px;
}
.year b {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.year span {
  font-size: 14px;
  color: var(--muted);
}

/* Desktop cards: 2 columns */
@media (min-width: 1024px) {
  .story-card, .dcard {
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 28px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 20px;
    margin-bottom: 18px;
  }
  .dcard .gal, .story-card .gal {
    width: 400px;
    height: 400px;
    flex: none;
  }
  .dcard .txt, .story-card .txt {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .dcard .story, .story-card .story {
    font-size: 16.5px;
    line-height: 1.7;
    color: var(--navy);
    display: -webkit-box;
    -webkit-line-clamp: 7;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .dcard.textonly, .story-card.textonly {
    grid-template-columns: 1fr;
  }
  .dcard.textonly .story, .story-card.textonly .story {
    -webkit-line-clamp: 3;
  }
}

/* Mobile cards: 1 column */
@media (max-width: 1023px) {
  .story-card, .dcard {
    display: block;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 16px;
    margin-bottom: 14px;
  }
  .dcard .story, .story-card .story {
    font-size: 16px;
    line-height: 1.65;
    color: var(--navy);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .dcard .gal, .story-card .gal {
    width: 100%;
    aspect-ratio: 1/1;
    margin-top: 10px;
  }
  .d-filters {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 10px 0;
  }
  .d-filters .kids-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .d-filters .mobile-controls-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .d-filters .sep { display: none; }
  .d-filters .search {
    width: 100%;
    margin-left: 0;
  }
}

.story.expanded {
  display: block !important;
  -webkit-line-clamp: unset !important;
  overflow: visible !important;
}
.more {
  display: inline-block;
  margin: 6px 0 10px;
  font-size: 15px;
  font-weight: 600;
  color: var(--gold-ink);
  cursor: pointer;
}
.more:hover { text-decoration: underline; }

.meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 8px;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 8px;
  min-height: 44px;
  width: 100%;
  box-sizing: border-box;
}
.meta-date {
  font-weight: 500;
  color: var(--muted);
  flex-shrink: 0;
}
.meta .who {
  white-space: normal;
  word-break: break-word;
  max-width: 100%;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  color: var(--navy);
  background: #F3EBDD;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 14px;
}
.meta .who i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #8A5A12;
  display: inline-block;
}

/* --------------------------------------------------------------------------
   GALLERY (Square 1:1)
   -------------------------------------------------------------------------- */
.gal {
  display: grid;
  aspect-ratio: 1/1;
  gap: 6px;
  grid-template-columns: 3fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  border-radius: var(--r-md);
  overflow: hidden;
  position: relative;
}
.gal.single {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
}
.gal .ph:first-child {
  grid-row: 1/4;
}
.gal.single .ph:first-child {
  grid-row: 1/2;
}
.gal .ph {
  position: relative;
  overflow: hidden;
  background: #ede7dc;
  cursor: pointer;
}
.gal .ph img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.2s ease;
}
.gal .ph:hover img {
  transform: scale(1.02);
}
.gal .ph .cover-tag {
  position: absolute;
  left: 6px;
  bottom: 6px;
  background: var(--gold);
  color: var(--navy);
  font-size: 10px;
  font-weight: 700;
  border-radius: 6px;
  padding: 2px 6px;
  letter-spacing: 0.04em;
}
.gal .plus::after {
  content: attr(data-more);
  position: absolute;
  inset: 0;
  background: rgba(22, 27, 33, 0.65);
  color: #fff;
  font-weight: 700;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* --------------------------------------------------------------------------
   ADMIN TOP BAR & STATUS
   -------------------------------------------------------------------------- */
.abar {
  height: 56px;
  background: var(--navy);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 17px;
  flex: 1;
  min-width: 0;
}
.brand .pill {
  font-size: 12px;
  font-weight: 600;
  background: var(--cream);
  color: var(--navy);
  padding: 2px 8px;
  border-radius: 999px;
}
.desktop-status-text {
  font-size: 14px;
  color: var(--cream);
  margin-right: 8px;
}
@media (max-width: 1023px) {
  .desktop-status-text, .desktop-add-btn { display: none !important; }
}
.btn-pub {
  height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--gold);
  color: var(--navy);
  font-weight: 700;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: none;
  cursor: pointer;
  transition: opacity 0.2s;
}
.btn-pub b {
  background: var(--navy);
  color: var(--gold);
  font-size: 12px;
  min-width: 22px;
  height: 22px;
  border-radius: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
}
.btn-pub.disabled {
  opacity: 0.45;
  cursor: default;
}
.desktop-add-btn {
  background: transparent;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.35);
  text-decoration: none;
}
.desktop-add-btn:hover {
  background: rgba(255, 255, 255, 0.12);
}
.btn-more {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  cursor: pointer;
}
.btn-more:hover { background: rgba(255, 255, 255, 0.12); }
.status {
  background: var(--cream);
  font-size: 14px;
  line-height: 1.4;
  padding: 10px 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--navy);
}
.status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #3E8E5E;
  flex: none;
}
.menu {
  position: absolute;
  right: 16px;
  top: 60px;
  width: 220px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 16px 40px rgba(22, 27, 33, 0.25);
  overflow: hidden;
  z-index: 150;
  border: 1px solid var(--line);
}
.menu a {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 52px;
  padding: 0 16px;
  font-size: 16px;
  color: var(--navy);
  text-decoration: none;
  border-bottom: 1px solid #F0EBE2;
}
.menu a:last-child { border-bottom: none; }
.menu a:hover { background: var(--cream); }
.menu svg { width: 20px; height: 20px; color: var(--muted); }

.toast {
  position: fixed;
  left: 20px;
  right: 20px;
  bottom: 30px;
  max-width: 480px;
  margin: 0 auto;
  background: var(--navy);
  color: #fff;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 15px;
  line-height: 1.5;
  display: flex;
  gap: 12px;
  align-items: center;
  box-shadow: 0 10px 30px rgba(22, 27, 33, 0.35);
  z-index: 300;
}
.toast svg { width: 22px; height: 22px; color: var(--gold); flex: none; }

/* FAB Mobile */
.fab {
  position: fixed;
  right: 20px;
  bottom: 24px;
  height: 56px;
  padding: 0 20px;
  border-radius: 28px;
  background: var(--gold);
  color: var(--navy);
  font-weight: 700;
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 8px 24px rgba(22, 27, 33, 0.28);
  text-decoration: none;
  white-space: nowrap;
  z-index: 90;
}
@media (min-width: 1024px) {
  .fab { display: none !important; }
}

/* Edit button on cards */
.btn-edit {
  margin-left: auto;
  height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 14px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--navy);
}
.btn-edit:hover { background: #fdfbf7; }
.btn-edit svg { width: 16px; height: 16px; }

/* Hidden card styling */
.hidden-card {
  opacity: 0.6;
  border-style: dashed !important;
}
.badge-hidden {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #EDE7DC;
  color: var(--navy);
  font-size: 13px;
  font-weight: 600;

  height: 32px;
  overflow: hidden;
  pointer-events: none;

.pswp__button--arrow:disabled {

  cursor: default;

.pswp__button--arrow .pswp__icn {
  top: 50%;
  margin-top: -30px;
  width: 60px;
  height: 60px;
  background: none;
  border-radius: 0;

.pswp--one-slide .pswp__button--arrow {

.pswp__button--arrow--next {
  right: 0px;
}
.pswp__button--arrow--next .pswp__icn {
  left: auto;
  right: 14px;

  transform: scale(-1, 1);
}

*/
.pswp__button--zoom {
  display: none;
}

.pswp--zoom-allowed .pswp__button--zoom {

", "thumb_path": "media-thumb/2021/2021-04-30_Tomey_nutrition-01.webp", "width": 1285, "height": 1920}], "total_archived_photos": 1}, {"id": "2022-07-04_Tomey_thu-bo-gui-tomey", "source_md": "01 Tomey 2008/2022/2022-07-04_Tomey_thu-bo-gui-tomey.md", "date": "2022-07-04", "time": "", "children": ["Tomey"], "type": "letter", "title": "Bức thư bố gửi Tomey (Superteens Bootcamp 2022)", "summary": "", "tags": ["thư", "lời khuyên", "trưởng thành", "superteens"], "open_at": "", "age_text": "13 tuổi 10 tháng 13 ngày", "content": "Gửi Nhật Thành yêu quý của bố,\n\nVậy là con đã 14 tuổi rồi, đang sắp sửa trở thành một người đàn ông. Bố mong con sẽ trưởng thành nhanh và trở thành người đàn ông có trách nhiệm, biết quan tâm đến gia đình và những người thân yêu của con.\n\nKhi con lớn lên, cuộc đời sẽ là trường học vĩ đại của con. Con sẽ không bao giờ biết trước khi nào và ở đâu con nhận được bài học của mình. Vì vậy, hãy coi tất cả những người con gặp là thầy của mình, hãy cởi mở với những cơ hội con gặp. Những người chân thành với con, hãy học cách trân trọng họ, những người làm hại con, hãy học cách đề phòng họ, những người xin lỗi con, hãy học cách tha thứ.\n\nVà con hãy luôn ghi nhớ, cuộc đời sẽ không ưu ái con. Sẽ có lúc con phải đau khổ khi tất cả những người quanh con đang vui vẻ tiệc tùng, có lúc con thất bại khi bạn bè con đều thành công rực rỡ. Điều con cần làm là giữ lấy niềm tin và lòng kiêu hãnh của một người đàn ông. Con có thể khóc, nhưng không phải trước mặt người khác. Con có thể sợ hãi, nhưng đừng lùi bước và đừng để cho người khác thấy sự sợ hãi của con.\n\nCon cũng cần biết chân thành nói xin lỗi khi làm sai, cảm ơn khi người khác giúp đỡ mình. Nhưng con đừng bao giờ giúp người vì muốn nhận lại từ họ, hãy làm hết mình, vì đó là giá trị của một người đàn ông.\n\nCàng lớn lên con sẽ càng hiểu giá trị của bạn bè. Hãy đối đãi họ chân thành, vì ngoài gia đình, những người bạn thực sự sẽ ở bên con lúc khó khăn tìm đến, và đến lúc đó con mới nhận ra họ quý giá nhường nào.\n\nCó rất nhiều thứ trong cuộc đời này sẽ thay đổi với con nhưng bố thì sẽ vẫn luôn bên cạnh con và yêu thương con vô điều kiện.\n\nBố yêu con giai nhiều.\n\nHà Nội, 04/07/2022", "cover": "", "captions": {}, "hidden": false, "photos": [], "total_archived_photos": 0}, {"id": "2023-05-07_Tomey_anh", "source_md": "01 Tomey 2008/2023/2023-05-07_Tomey_anh.md", "date": "2023-05-07", "time": "", "children": ["Tomey"], "type": "story", "title": "", "summary": "", "tags": [], "open_at": "", "age_text": "14 tuổi 8 tháng 16 ngày", "content": "Đưa Tomey đi style tóc", "cover": "", "captions": {}, "hidden": false, "photos": [{"filename": "2023-05-07_Tomey_anh-01.jpg", "caption": "", "original_path": "media/2023/2023-05-07_Tomey_anh-01.webp", "media_type": "image", "thumb_base64": "", "preview_path": "media/2023/2023-05-07_Tomey_anh-01.webp", "thumb_path": "media-thumb/2023/2023-05-07_Tomey_anh-01.webp", "width": 1440, "height": 1920}, {"filename": "2023-05-07_Tomey_anh-02.jpg", "caption": "", "original_path": "media/2023/2023-05-07_Tomey_anh-02.webp", "media_type": "image", "thumb_base64": "", "preview_path": "media/2023/2023-05-07_Tomey_anh-02.webp", "thumb_path": "media-thumb/2023/2023-05-07_Tomey_anh-02.webp", "width": 1440, "height": 1920}], "total_archived_photos": 2}, {"id": "2023-08-21_Tomey_anh", "source_md": "01 Tomey 2008/2023/2023-08-21_Tomey_anh.md", "date": "2023-08-21", "time": "", "children": ["Tomey"], "type": "", "title": "", "summary": "", "tags": [], "open_at": "", "age_text": "15 tuổi", "content": "", "cover": "", "captions": {}, "hidden": false, "photos": [{"filename": "2023-08-21_Tomey_anh-01.jpg", "caption": "", "original_path": "media/2023/2023-08-21_Tomey_anh-01.webp", "media_type": "image", "thumb_base64": "", "preview_path": "media/2023/2023-08-21_Tomey_anh-01.webp", "thumb_path": "media-thumb/2023/2023-08-21_Tomey_anh-01.webp", "width": 621, "height": 828}, {"filename": "2023-08-21_Tomey_anh-02.jpg", "caption": "", "original_path": "media/2023 (function () {
  'use strict';

  /* =====================================================================

  const VERSION = '2.3';
  const DEFAULT_MEDIA_ROOT = '';
  const GALLERY_MAX = 4;
  const IS_READ_ONLY = (typeof window !== 'undefined' && Boolean(window.ARCHIVE_READ_ONLY));
  const IS_ADMIN = (typeof window !== 'undefined' && Boolean(window.ARCHIVE_IS_ADMIN));
  const API_URL = (typeof window !== 'undefined' && window.ARCHIVE_API_URL) || "";

  const TYPE_META = {
    '':        { label: 'Ngày có ảnh', icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>' },

  };

  const svg = (d, cls) => `<svg${cls ? ` class="${cls}"` : ''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICON = {
    search:   svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
    star:     svg('<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>'),
    trash:    svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>'),
    pencil:   svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
    play:     '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
    check:    svg('<path d="M5 12l5 5L20 7"/>'),
    eyeOff:   svg('<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'),
    more:     '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
    close:    svg('<path d="M6 6l12 12M18 6 6 18"/>')
  };

  /* =====================================================================
     STATE & DATA
     ===================================================================== */
  const archive = window.ARCHIVE_DATA || null;
  const PENDING_EDITS_KEY = 'lf_pending_edits';

  function getPendingEdits() {
    try {
      const raw = localStorage.getItem(PENDING_EDITS_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function addPendingEdit(id) {
    if (!id) return;
    try {
      const list = getPendingEdits();
      if (!list.includes(id)) {
        list.push(id);
        localStorage.setItem(PENDING_EDITS_KEY, JSON.stringify(list));
      }
    } catch (e) {}
    updateAdminStatusText();
  }

  function clearPendingEdits() {
    try {
      localStorage.removeItem(PENDING_EDITS_KEY);
    } catch (e) {}
    updateAdminStatusText();
  }

  let currentEditItem = null;
  let editPhotosState = [];

  const state = {
    filters: { child: 'all', year: 'all', type: 'all', search: '' },
    expanded: new Set(),
    activeDropdown: null
  };

  let rawItems = (archive && Array.isArray(archive.items)) ? archive.items.slice() : [];
  // Public mode: lọc bỏ bài ẩn
  if (!IS_ADMIN) {
    rawItems = rawItems.filter(it => !it.hidden);
  }
  const items = rawItems;

  const children = (archive && Array.isArray(archive.children)) ? archive.children.slice() : [];
  children.sort((a, b) => (a.display_order || 99) - (b.display_order || 99));
  const childMap = {};
  children.forEach(c => { childMap[c.id] = c; });

  const mediaRoot = (archive && archive.project && archive.project.media_root != null)
    ? archive.project.media_root : DEFAULT_MEDIA_ROOT;

  function folderRank(it) {
    const ids = it.children || [];
    if (ids.includes('Chung')) return 50;
    const c = childMap[ids[0]];
    return c ? (c.display_order || 9) : 9;
  }
  items.sort((a, b) =>
    (b.date || '').localeCompare(a.date || '') ||
    (b.time || '').localeCompare(a.time || '') ||
    folderRank(a) - folderRank(b));

  /* =====================================================================
     HELPER FUNCTIONS
     ===================================================================== */
  function getAdminToken() {
    try { return localStorage.getItem("lf_admin_token") || ""; } catch(e) { return ""; }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function foldChar(ch) {
    const map = {
      'a':'a','à':'a','á':'a','ả':'a','ã':'a','ạ':'a','ă':'a','ằ':'a','ắ':'a','ẳ':'a','ẵ':'a','ặ':'a','â':'a','ầ':'a','ấ':'a','ẩ':'a','ẫ':'a','ậ':'a',
      'd':'d','đ':'d','e':'e','è':'e','é':'e','ẻ':'e','ẽ':'e','ẹ':'e','ê':'e','ề':'e','ế':'e','ể':'e','ễ':'e','ệ':'e',
      'i':'i','ì':'i','í':'i','ỉ':'i','ĩ':'i','ị':'i','o':'o','ò':'o','ó':'o','ỏ':'o','õ':'o','ọ':'o','ô':'o','ồ':'o','ố':'o','ổ':'o','ỗ':'o','ộ':'o','ơ':'o','ờ':'o','ớ':'o','ở':'o','ỡ':'o','ợ':'o',
      'u':'u','ù':'u','ú':'u','ủ':'u','ũ':'u','ụ':'u','ư':'u','ừ':'u','ứ':'u','ử':'u','ữ':'u','ự':'u','y':'y','ỳ':'y','ý':'y','ỷ':'y','ỹ':'y','ỵ':'y'
    };
    return map[ch] || ch;
  }
  function fold(str) {
    return String(str || '').toLowerCase().split('').map(foldChar).join('').replace(/[\s\-_]+/g, ' ').trim();
  }

  function renderMarkdown(text) {
    if (!text) return '';
    const safe = escapeHtml(text);
    return safe
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/\n\n+/g, '</p><p>')
      .replace(/\n/g, '<br>');
  }

  function formatDateVN(dateStr) {
    if (!dateStr) return '';
    const m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[3]}/${m[2]}/${m[1]}` : dateStr;
  }

  function parseDate(str) {
    if (!str) return null;
    const m = String(str).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
  }

  function ageParts(birthStr, dateStr) {
    const b = parseDate(birthStr), d = parseDate(dateStr);
    if (!b || !d || d < b) return null;
    let y = d.getUTCFullYear() - b.getUTCFullYear();
    let m = d.getUTCMonth() - b.getUTCMonth();
    let day = d.getUTCDate() - b.getUTCDate();
    if (day < 0) {
      m--;
      const prevM = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 0));
      day += prevM.getUTCDate();
    }
    if (m < 0) { y--; m += 12; }
    return { years: y, months: m, days: day };
  }

  function ageShort(p) {
    if (!p) return '';
    if (p.years === 0 && p.months === 0) return `${p.days} ngày`;
    if (p.years === 0) return `${p.months} tháng`;
    if (p.months === 0) return `${p.years} tuổi`;
    return `${p.years} tuổi ${p.months} tháng`;
  }

  function ageAt(birthStr, dateStr) {
    return ageShort(ageParts(birthStr, dateStr));
  }

  function mediaUrl(path) {
    if (!path) return '';
    if (/^(https?:)?\/\//.test(path) || path.startsWith('data:')) return path;
    return mediaRoot + path;
  }

  function extOf(p) {
    const fn = (p && (p.filename || p.original_path)) || '';
    const m = fn.match(/\.([a-zA-Z0-9]+)(?:[?#]|$)/);
    return m ? m[1].toLowerCase() : '';
  }

  function isVideo(p) {
    return p.media_type === 'video' || ['mp4', 'mov', 'm4v', 'webm'].includes(extOf(p));
  }

  function thumbSrc(p) {
    if (p.thumb_path) return mediaUrl(p.thumb_path);
    if (p.preview_path) return mediaUrl(p.preview_path);
    if (p.thumb_base64) return p.thumb_base64;
    return mediaUrl(p.original_path);
  }

  function activePhotosOf(item) {
    return (item.photos || []).slice();
  }

  function getFolderOwner(item) {
    const src = item.source_md || '';
    if (src.includes('01 Tomey')) return 'Tomey';
    if (src.includes('02 Ben')) return 'Ben';
    if (src.includes('03 Marc')) return 'Marc';
    if (src.includes('04 Alex')) return 'Alex';
    if (src.includes('05 Chung')) return 'Chung';
    return (item.children && item.children[0]) || '';
  }

  function showToast(message) {
    let t = document.getElementById('admin-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'admin-toast';
      t.className = 'toast';
      t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg><span id="toast-text"></span>`;
      document.body.appendChild(t);
    }
    const txtEl = t.querySelector('#toast-text') || t;
    txtEl.innerHTML = message;
    t.style.display = 'flex';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.display = 'none'; }, 4500);
  }

  /* =====================================================================
     FILTERS & MATCHING
     ===================================================================== */
  function matches(item, f) {
    if (f.child !== 'all') {
      if (f.child === 'Chung') {
        if (!(item.children || []).includes('Chung')) return false;
      } else {
        if (!(item.children || []).includes(f.child)) return false;
      }
    }
    if (f.year !== 'all') {
      const y = item.date ? item.date.substring(0, 4) : '';
      if (y !== f.year) return false;
    }
    if (f.type !== 'all') {
      if ((item.type || '') !== f.type) return false;
    }
    if (f.search) {
      const q = fold(f.search);
      const corpus = fold([
        item.content || '',
        item.title || '',
        item.date || '',
        (item.children || []).join(' ')
      ].join(' '));
      if (!corpus.includes(q)) return false;
    }
    return true;
  }

  function getFilteredItems() {
    return items.filter(it => matches(it, state.filters));
  }

  /* =====================================================================
     RENDERING: HEADER & FILTERS
     ===================================================================== */
  function renderHeader() {
    const statsEl = document.getElementById('header-stats');
    if (statsEl) {
      const totalStories = items.length;
      let totalMedia = 0;
      items.forEach(it => { totalMedia += (it.photos || []).length; });
      statsEl.innerHTML = `${totalStories} câu chuyện · ${totalMedia} ảnh &amp; video`;
    }

    // Admin Desktop status
    updateAdminStatusText();
  }

  function updateAdminStatusText() {
    const list = getPendingEdits();
    const count = list.length;
    const countEl = document.getElementById('publish-count');
    const pubBtn = document.getElementById('btn-admin-publish');
    if (countEl) {
      countEl.textContent = count;
    }
    if (pubBtn) {
      if (count > 0) {
        pubBtn.classList.remove('disabled');
        pubBtn.innerHTML = `Đăng <b>${count}</b>`;
      } else {
        pubBtn.classList.add('disabled');
        pubBtn.innerHTML = `Đăng`;
      }
    }

    const dStatus = document.getElementById('admin-desktop-status');
    const sText = document.getElementById('admin-status-text');
    const sBar = document.getElementById('admin-status-bar');

    let statusMsg = "Máy tính đang bật";
    if (count > 0) {
      statusMsg = `${count} thay đổi chờ đăng · Máy tính đang bật`;
    }
    if (dStatus) dStatus.textContent = statusMsg;
    if (sText) sText.textContent = statusMsg;
    if (sBar) sBar.style.display = count > 0 ? 'flex' : 'none';
  }

  /* =====================================================================
     RENDERING: CARDS & GALLERY
     ===================================================================== */
  function renderGalleryHtml(item) {
    const photos = activePhotosOf(item);
    if (!photos.length) return '';

    const isSingle = photos.length === 1;
    const shown = photos.slice(0, GALLERY_MAX);
    const extra = photos.length - shown.length;
    const coverFn = item.cover || (photos[0] && photos[0].filename);

    const itemsHtml = shown.map((p, idx) => {
      const src = thumbSrc(p);
      const isCover = (p.filename === coverFn);
      const isLast = (idx === shown.length - 1 && extra > 0);
      return `
        <div class="ph${isLast ? ' plus' : ''}" role="button" tabindex="0"
             data-item-id="${escapeHtml(item.id)}" data-index="${idx}"
             ${isLast ? `data-more="+${extra}"` : ''}
             aria-label="Xem ảnh ${idx + 1}/${photos.length}">
          <img src="${escapeHtml(src)}" alt="${escapeHtml(p.caption || '')}" loading="lazy">
          ${IS_ADMIN && isCover && idx === 0 ? '<span class="cover-tag">BÌA</span>' : ''}
        </div>
      `;
    }).join('');

    return `<div class="gal${isSingle ? ' single' : ''}">${itemsHtml}</div>`;
  }

  function renderCard(item) {
    const photos = activePhotosOf(item);
    const hasPhotos = photos.length > 0;
    const isHidden = Boolean(item.hidden);

    // Who badges (each child has its own badge to allow clean wrapping)
    const whoBadges = (item.children || []).map(cid => {
      const c = childMap[cid];
      const label = (c && c.birth_date && item.date)
        ? `${cid} · ${ageAt(c.birth_date, item.date)}`
        : cid;
      return `<span class="who"><i></i>${escapeHtml(label)}</span>`;
    }).join('');

    const dateStr = formatDateVN(item.date);
    const isExpanded = state.expanded.has(item.id);

    return `
      <article class="dcard${hasPhotos ? '' : ' textonly'}${isHidden ? ' hidden-card' : ''}" id="card-${escapeHtml(item.id)}">
        ${hasPhotos ? renderGalleryHtml(item) : ''}
        <div class="txt">
          <div class="meta">
            <span class="meta-date">${dateStr}</span>
            ${whoBadges}
            ${isHidden ? `<span class="badge-hidden">${ICON.eyeOff} Đang ẩn</span>` : ''}
            ${IS_ADMIN ? (
              isHidden
                ? `<button type="button" class="btn-edit btn-unhide" data-action="unhide-post" data-id="${escapeHtml(item.id)}">Hiện lại</button>`
                : `<button type="button" class="btn-edit" data-action="edit-post" data-id="${escapeHtml(item.id)}">${ICON.pencil} Sửa</button>`
            ) : ''}
          </div>
          ${item.content ? `
            <div class="story${isExpanded ? ' expanded' : ''}">${renderMarkdown(item.content)}</div>
            <span class="more" role="button" tabindex="0" data-action="toggle-story" data-id="${escapeHtml(item.id)}">
              ${isExpanded ? 'Thu gọn' : 'Xem thêm'}
            </span>
          ` : ''}
        </div>
      </article>
    `;
  }

  function renderTimeline() {
    const stream = document.getElementById('timeline-stream');
    if (!stream) return;

    const filtered = getFilteredItems();
    if (!filtered.length) {
      stream.innerHTML = `
        <div class="empty-state">
          <p class="empty-state-title">Không tìm thấy kỷ niệm nào</p>
          <p>Thử đổi bộ lọc hoặc tìm kiếm bằng từ khóa khác.</p>
        </div>
      `;
      return;
    }

    // Nhóm theo năm
    const byYear = new Map();
    filtered.forEach(it => {
      const y = it.date ? it.date.substring(0, 4) : 'Khác';
      if (!byYear.has(y)) byYear.set(y, []);
      byYear.get(y).push(it);
    });

    let html = '';
    for (const [y, yItems] of byYear.entries()) {
      html += `
        <div class="year">
          <b>${y}</b>
          <span>${yItems.length} bài</span>
        </div>
      `;
      html += yItems.map(renderCard).join('');
    }

    stream.innerHTML = html;
  }

  function rerenderSingleCard(itemId) {
    const it = items.find(x => x.id === itemId);
    if (!it) return;
    const cardEl = document.getElementById(`card-${itemId}`);
    if (cardEl) {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = renderCard(it);
      const newCard = tempDiv.firstElementChild;
      if (newCard) {
        cardEl.replaceWith(newCard);
      }
    }
  }

  /* =====================================================================
     PHOTOSWIPE VIEWER (CHUNG CHO VIEWER VÀ ADMIN)
     ===================================================================== */
  async function openPhotoSwipe(item, index) {
    if (typeof window.PhotoSwipe !== 'function') return;
    const active = activePhotosOf(item);
    if (!active.length) return;

    const title = item.title || '';
    const dateVN = formatDateVN(item.date);
    const ages = (item.children || []).filter(id => childMap[id] && childMap[id].birth_date)
      .map(id => `${id} ${ageAt(childMap[id].birth_date, item.date)}`).join(', ');

    const dataSource = active.map(p => {
      const cap = p.caption || '';
      if (isVideo(p)) {
        return {
          html: `<div class="pswp-video-wrap" style="display:flex;align-items:center;justify-content:center;height:100%;"><video src="${escapeHtml(mediaUrl(p.original_path))}" controls playsinline style="max-width:100%;max-height:100%;"></video></div>`,
          _cap: cap,
          _video: true
        };
      }
      const fullSrc = mediaUrl(p.preview_path || p.original_path);
      const mSrc = thumbSrc(p);
      return {
        src: fullSrc,
        msrc: mSrc,
        width: p.width || 1920,
        height: p.height || 1080,
        alt: cap || title,
        _cap: cap
      };
    });

    const pswp = new window.PhotoSwipe({
      dataSource,
      index: Math.max(0, Math.min(index, active.length - 1)),
      bgOpacity: 1,
      loop: false,
      showHideAnimationType: 'zoom',
      initialZoomLevel: 'fit',
      secondaryZoomLevel: zl => zl.fit * 2.5,
      maxZoomLevel: zl => Math.max(zl.fit * 6, 1),
      pinchToClose: true,
      closeOnVerticalDrag: true,
      wheelToZoom: true,
      tapAction: 'toggle-controls',
      doubleTapAction: 'zoom',
      imageClickAction: 'zoom-or-close',
      bgClickAction: 'close',
      padding: { top: 0, bottom: 0, left: 0, right: 0 },
      closeTitle: 'Đóng',
      zoomTitle: 'Phóng to',
      arrowPrevTitle: 'Ảnh trước',
      arrowNextTitle: 'Ảnh sau'
    });

    pswp.on('uiRegister', () => {
      pswp.ui.registerElement({
        name: 'leo-caption',
        order: 9,
        isButton: false,
        appendTo: 'root',
        onInit: (el, p) => {
          const upd = () => {
            const d = p.currSlide && p.currSlide.data || {};
            const cap = d._cap || '';
            const meta = [dateVN, ages].filter(Boolean).join(' · ');
            el.innerHTML = `
              ${cap ? `<div style="font-size:15px;font-weight:600;margin-bottom:4px;color:#fff;">${escapeHtml(cap)}</div>` : ''}
              ${meta ? `<div style="font-size:13px;color:rgba(255,255,255,0.7);">${escapeHtml(meta)}</div>` : ''}
            `;
            el.style.cssText = 'position:absolute;left:16px;right:16px;bottom:16px;text-align:center;background:rgba(22,27,33,0.75);padding:10px 16px;border-radius:12px;z-index:100;pointer-events:none;';
          };
          p.on('change', upd);
          upd();
        }
      });
    });

    pswp.init();
  }

     ADMIN EDIT PANEL (DRAWER / SHEET)

  function openEditPanel(itemId) {
    const item = items.find(it => it.id === itemId);
    if (!item) return;

    currentEditItem = item;
    const panel = document.getElementById('edit-panel');
    const scrim = document.getElementById('edit-scrim');
    if (!panel || !scrim) return;

    // 1. Title
    const titleEl = document.getElementById('edit-panel-title');
    if (titleEl) {
      titleEl.textContent = `Sửa bài · ${formatDateVN(item.date)}`;
    }

    // 2. Story
    const storyEl = document.getElementById('edit-story');
    if (storyEl) {
      storyEl.value = item.content || '';
    }

    // 3. Date
    const dateEl = document.getElementById('edit-date');
    if (dateEl) {
      dateEl.value = item.date || '';
    }

    // 4. Children (Điều kiện 2: Khóa chip chủ folder)
    const owner = getFolderOwner(item);
    const kidsGroup = document.getElementById('edit-kids-group');
    const helperEl = document.getElementById('edit-owner-helper');
    if (kidsGroup) {
      const curKids = item.children || [];
      const boys = ['Tomey', 'Ben', 'Marc', 'Alex'];
      const allSelected = boys.every(b => curKids.includes(b));

      kidsGroup.innerHTML = boys.map(b => {
        const isOwner = (b === owner);
        const isOn = isOwner || curKids.includes(b);
        return `
          <span class="chip${isOn ? ' on' : ''}${isOwner ? ' chip-locked' : ''}"
                data-child="${b}" ${isOwner ? 'data-locked="true"' : ''}>
            ${isOn ? ICON.check : ''}${b}
          </span>
        `;
      }).join('') + `
        <span class="chip${allSelected ? ' on' : ''}" data-child="all">
          ${allSelected ? ICON.check : ''}Cả nhà
        </span>
      `;

      if (helperEl) {
        if (['Tomey', 'Ben', 'Marc', 'Alex'].includes(owner)) {
          helperEl.textContent = `Bài thuộc kho của ${owner}.`;
          helperEl.style.display = 'block';
        } else {
          helperEl.style.display = 'none';
        }
      }
    }

    // 5. Photos list
    const coverFn = item.cover || ((item.photos && item.photos[0]) ? item.photos[0].filename : '');
    editPhotosState = (item.photos || []).map(p => ({
      filename: p.filename,
      caption: p.caption || '',

      <div class="prow${p.removed ? ' is-removed' : ''}" data-fn="${escapeHtml(p.filename)}">

        </div>

  function closeEditPanel() {
    const panel = document.getElementById('edit-panel');
    const scrim = document.getElementById('edit-scrim');
    if (panel) panel.style.display = 'none';
    if (scrim) scrim.style.display = 'none';

  async function saveEditPanel() {
    if (!currentEditItem) return;
    const saveBtn = document.getElementById('btn-edit-save');
    const errEl = document.getElementById('edit-error-msg');
    if (errEl) errEl.style.display = 'none';

    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Đang lưu...';
    }

    try {
      const storyVal = (document.getElementById('edit-story')?.value || '').trim();
      const dateVal = (document.getElementById('edit-date')?.value || '').trim();
      const isHidden = Boolean(document.getElementById('edit-hidden-switch')?.checked);

      // Children
      const selectedKids = [];
      document.querySelectorAll('#edit-kids-group .chip.on').forEach(el => {
        const c = el.getAttribute('data-child');
        if (c && c !== 'all') selectedKids.push(c);
      });

      // Captions & Cover & Deleted
      const captionsMap = {};
      document.querySelectorAll('.edit-photo-cap-input').forEach(inp => {
        const fn = inp.getAttribute('data-fn');
        const cap = inp.value.trim();
        if (fn && cap) captionsMap[fn] = cap;
      });
      // Merge with unrendered photos if any
      editPhotosState.forEach(p => {
        if (!captionsMap[p.filename] && p.caption) {
          captionsMap[p.filename] = p.caption;
        }
      });

      const deletedList = editPhotosState.filter(p => p.removed).map(p => p.filename);
      const activeCoverPhoto = editPhotosState.find(p => p.isCover && !p.removed) || editPhotosState.find(p => !p.removed);
      const coverVal = activeCoverPhoto ? activeCoverPhoto.filename : '';

      const payload = {
        token: getAdminToken(),
        action: 'notes_save',
        notes: {
          cards: {
            [currentEditItem.id]: {
              content: storyVal,
              date: dateVal,
              children: selectedKids,
              cover: coverVal,
              captions: captionsMap,
              deleted_photos: deletedList,
              hidden: isHidden
            }
          }
        }
      };

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!data.ok) {
        throw new Error(data.error || 'Server error');
      }

      // Lưu thành công -> Cập nhật bộ nhớ cục bộ
      currentEditItem.content = storyVal;
      currentEditItem.date = dateVal;
      currentEditItem.children = selectedKids;
      currentEditItem.cover = coverVal;
      currentEditItem.hidden = isHidden;
      currentEditItem.captions = captionsMap;
      if (currentEditItem.photos) {
        currentEditItem.photos.forEach(p => {
          p.caption = captionsMap[p.filename] || '';
        });
        if (deletedList.length) {
          currentEditItem.photos = currentEditItem.photos.filter(p => !deletedList.includes(p.filename));
        }
      }

      addPendingEdit(currentEditItem.id);
      rerenderSingleCard(currentEditItem.id);
      closeEditPanel();
      showToast('Đã lưu. Bấm <b>Đăng</b> khi muốn đưa lên album.');

    } catch (err) {
      console.error('Lỗi lưu ghi chú:', err);
      if (errEl) {
        errEl.textContent = 'Chưa lưu được. Thử lại.';
        errEl.style.display = 'block';
      }
      showToast('Chưa lưu được. Thử lại.');
    } finally {
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Lưu';
      }
    }
  }

  async function unhidePost(itemId) {
    const item = items.find(it => it.id === itemId);
    if (!item) return;

    try {
      const payload = {
        token: getAdminToken(),
        action: 'notes_save',
        notes: {
          cards: {
            [item.id]: { hidden: false }
          }
        }
      };
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Lỗi');

      item.hidden = false;
      addPendingEdit(item.id);
      rerenderSingleCard(item.id);
      showToast('Đã hiện bài lại. Bấm <b>Đăng</b> khi muốn đưa lên album.');
    } catch (e) {
      showToast('Chưa cập nhật được. Thử lại.');
    }
  }

  async function handleAdminPublish() {
    const pendingList = getPendingEdits();
    if (pendingList.length === 0) {
      showToast('Chưa có thay đổi nào để đăng');
      return;
    }
    const pubBtn = document.getElementById('btn-admin-publish');
    if (pubBtn) pubBtn.disabled = true;

    try {
      const payload = {
        token: getAdminToken(),
        action: 'publish_request',
        so_bai_moi: 0,
        so_chinh_sua: pendingList.length
      };
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Lỗi');

      clearPendingEdits();
      showToast('Đã gửi yêu cầu đăng. Máy tính sẽ tự động duyệt và đăng lên album trong vài phút.');
    } catch (e) {
      showToast('Chưa gửi được yêu cầu đăng. Vui lòng thử lại.');
    } finally {
      if (pubBtn) pubBtn.disabled = false;
    }
  }

  /* =====================================================================
     EVENT LISTENERS
     ===================================================================== */
  function setupEvents() {
    // 1. Children filters click
    document.addEventListener('click', e => {
      const childBtn = e.target.closest('[data-filter-child]');
      if (childBtn) {
        state.filters.child = childBtn.getAttribute('data-filter-child');
        renderFilterControls();
        renderTimeline();
        return;
      }

      // Year dropdown
      const yearPopBtn = e.target.closest('#year-filter-btn');
      if (yearPopBtn) {
        const pop = document.getElementById('year-dropdown');
        if (pop) pop.style.display = pop.style.display === 'none' ? 'block' : 'none';
        return;
      }
      const yearOpt = e.target.closest('[data-filter-year]');
      if (yearOpt) {
        state.filters.year = yearOpt.getAttribute('data-filter-year');
        const pop = document.getElementById('year-dropdown');
        if (pop) pop.style.display = 'none';
        renderFilterControls();
        renderTimeline();
        return;
      }

      // Type dropdown
      const typePopBtn = e.target.closest('#type-filter-btn');
      if (typePopBtn) {
        const pop = document.getElementById('type-dropdown');
        if (pop) pop.style.display = pop.style.display === 'none' ? 'block' : 'none';
        return;
      }
      const typeOpt = e.target.closest('[data-filter-type]');
      if (typeOpt) {
        state.filters.type = typeOpt.getAttribute('data-filter-type');
        const pop = document.getElementById('type-dropdown');
        if (pop) pop.style.display = 'none';
        renderFilterControls();
        renderTimeline();
        return;
      }

      // Đóng dropdown khi click ra ngoài
      if (!e.target.closest('.filter-dropdown-wrap')) {
        const yPop = document.getElementById('year-dropdown');
        const tPop = document.getElementById('type-dropdown');
        if (yPop) yPop.style.display = 'none';
        if (tPop) tPop.style.display = 'none';
      }

      // Toggle expand story
      const moreBtn = e.target.closest('[data-action="toggle-story"]');
      if (moreBtn) {
        const id = moreBtn.getAttribute('data-id');
        if (state.expanded.has(id)) {
          state.expanded.delete(id);
        } else {
          state.expanded.add(id);
        }
        rerenderSingleCard(id);
        return;
      }

      // Photo click -> PhotoSwipe
      const phEl = e.target.closest('.gal .ph');
      if (phEl) {
        const itemId = phEl.getAttribute('data-item-id');
        const idx = parseInt(phEl.getAttribute('data-index') || '0', 10);
        const it = items.find(x => x.id === itemId);
        if (it) openPhotoSwipe(it, idx);
        return;
      }

      // Admin: Nút Sửa
      const editBtn = e.target.closest('[data-action="edit-post"]');
      if (editBtn) {
        const id = editBtn.getAttribute('data-id');
        openEditPanel(id);
        return;
      }

      // Admin: Nút Hiện lại
      const unhideBtn = e.target.closest('[data-action="unhide-post"]');
      if (unhideBtn) {
        const id = unhideBtn.getAttribute('data-id');
        unhidePost(id);
        return;
      }

      // Admin: Menu ⋯
      const moreMenuBtn = e.target.closest('#btn-admin-more');
      if (moreMenuBtn) {
        const m = document.getElementById('admin-menu');
        if (m) m.style.display = m.style.display === 'none' ? 'block' : 'none';
        return;
      }
      if (!e.target.closest('#btn-admin-more') && !e.target.closest('#admin-menu')) {
        const m = document.getElementById('admin-menu');
        if (m) m.style.display = 'none';
      }

      // Admin: Đăng xuất
      const logoutBtn = e.target.closest('#btn-admin-logout');
      if (logoutBtn) {
        e.preventDefault();
        try { localStorage.removeItem('lf_admin_token'); } catch(ex) {}
        if (typeof window.LEO_SHOW_PWD_GATE === 'function') {
          window.LEO_SHOW_PWD_GATE();
        }
        return;
      }

      // Public: Khóa lại / Đăng xuất
      const lockBtn = e.target.closest('#btn-lock-album');
      if (lockBtn) {
        try { sessionStorage.removeItem('lf_authenticated'); localStorage.removeItem('lf_remember_auth'); } catch(ex) {}
        if (typeof window.LEO_SHOW_PWD_GATE === 'function') {
          window.LEO_SHOW_PWD_GATE();
        }
        return;
      }

      // Admin: Đăng
      const pubBtn = e.target.closest('#btn-admin-publish');
      if (pubBtn) {
        handleAdminPublish();
        return;
      }

      // Edit Panel: Hủy
      const cancelBtn = e.target.closest('#btn-edit-cancel') || e.target.closest('#edit-scrim');
      if (cancelBtn) {
        closeEditPanel();
        return;
      }

      // Edit Panel: Lưu
      const saveBtn = e.target.closest('#btn-edit-save');
      if (saveBtn) {
        saveEditPanel();
        return;
      }

      // Edit Panel: Xem cả n ảnh
      const seeAllPhotosBtn = e.target.closest('#edit-see-all-photos');
      if (seeAllPhotosBtn) {
        renderEditPhotosList(true);
        return;
      }

      // Edit Panel: Kids chip click
      const kidChip = e.target.closest('#edit-kids-group .chip');
      if (kidChip) {
        if (kidChip.getAttribute('data-locked') === 'true') {
          return; // Khóa chủ folder
        }
        const c = kidChip.getAttribute('data-child');
        if (c === 'all') {
          const boys = ['Tomey', 'Ben', 'Marc', 'Alex'];
          const chips = Array.from(document.querySelectorAll('#edit-kids-group .chip')).filter(el => el.getAttribute('data-child') !== 'all');
          const allOn = chips.every(el => el.classList.contains('on'));
          chips.forEach(el => {
            if (el.getAttribute('data-locked') !== 'true') {
              if (allOn) {
                el.classList.remove('on');
                const svgCheck = el.querySelector('svg');
                if (svgCheck) svgCheck.remove();
              } else {
                if (!el.classList.contains('on')) {
                  el.classList.add('on');
                  el.insertAdjacentHTML('afterbegin', ICON.check);
                }
              }
            }
          });
          kidChip.classList.toggle('on', !allOn);
        } else {
          kidChip.classList.toggle('on');
          if (kidChip.classList.contains('on')) {
            kidChip.insertAdjacentHTML('afterbegin', ICON.check);
          } else {
            const svgCheck = kidChip.querySelector('svg');
            if (svgCheck) svgCheck.remove();
          }
        }
        return;
      }

      // Edit Panel: Star bìa click
      const starBtn = e.target.closest('.prow .star-btn');
      if (starBtn) {
        const fn = starBtn.getAttribute('data-fn');
        editPhotosState.forEach(p => { p.isCover = (p.filename === fn); });
        renderEditPhotosList(true);
        return;
      }

      // Edit Panel: Delete photo click
      const delBtn = e.target.closest('.prow .del-btn');
      if (delBtn) {
        const fn = delBtn.getAttribute('data-fn');
        const p = editPhotosState.find(x => x.filename === fn);
        if (p) {
          p.removed = !p.removed;
          if (p.removed && p.isCover) {
            p.isCover = false;
            const nextActive = editPhotosState.find(x => !x.removed);
            if (nextActive) nextActive.isCover = true;
          }
        }
        renderEditPhotosList(true);
        return;
      }
    });

    // Search input with debounce
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      let timer = null;
      searchInput.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          state.filters.search = searchInput.value.trim();
          renderTimeline();
        }, 250);
      });
    }

    // Edit Panel: Add Photo input change
    const addPhotoInput = document.getElementById('edit-add-photo-input');
    if (addPhotoInput) {
      addPhotoInput.addEventListener('change', async () => {
        const files = Array.from(addPhotoInput.files || []);
        if (!files.length || !currentEditItem) return;

        showToast('Đang tải ảnh lên bài...');
        for (const file of files) {
          try {
            const reader = new FileReader();
            const b64Promise = new Promise(res => {
              reader.onload = () => res(reader.result.split(',')[1]);
              reader.readAsDataURL(file);
            });
            const b64 = await b64Promise;

            const payload = {
              token: getAdminToken(),
              action: 'photo_add',
              target_id: currentEditItem.id,
              files: [file.name],
              file_meta: [{ name: file.name, size: file.size, content: b64 }]
            };
            const res = await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.ok) {
              editPhotosState.push({
                filename: file.name,
                caption: '',
                isCover: false,
                removed: false,
                thumb: URL.createObjectURL(file)
              });
            }
          } catch (e) {
            console.error('Lỗi tải ảnh:', e);
          }
        }
        renderEditPhotosList(true);
        showToast('Đã thêm ảnh vào danh sách bài.');
      });
    }
  }

  /* =====================================================================
     INITIALIZATION
     ===================================================================== */
  function init() {
    renderHeader();
    renderFilterControls();
    renderTimeline();
    setupEvents();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  </script>
  <script>
    (function() {
      const HASH = "25cb62ef00587101ef0a028f2306b07efe5449962442b7eaf9a5692a02b0f3ce";
      const IS_ADMIN = true;
      const gate = document.getElementById('pwd-gate');
      const input = document.getElementById('pwd-input');
      const eye = document.getElementById('pwd-eye');
      const remember = document.getElementById('pwd-remember');
      const btn = document.getElementById('pwd-submit');
      const err = document.getElementById('pwd-error');

      function unlock() {
        document.body.classList.add('authenticated');
        if (gate) gate.style.display = 'none';
        if (err) err.style.display = 'none';
      }

      function showPwdGate(msg) {
        document.body.classList.remove('authenticated');
        if (gate) gate.style.display = 'flex';
        if (err) {
          if (msg) {
            err.textContent = msg;
            err.style.display = 'block';
          } else {
            err.style.display = 'none';
          }
        }
        if (input) {
          input.value = '';
          input.focus();
        }
      }
      window.LEO_SHOW_PWD_GATE = showPwdGate;

      async function sha256(str) {
        const buf = new TextEncoder().encode(str);
        const digest = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
      }

      // Tự động mở nếu đã ghi nhớ
      try {
        const saved = localStorage.getItem('lf_remember_auth');
        const session = sessionStorage.getItem('lf_authenticated');
        if (saved === HASH || session === '1') {
          unlock();
          return;
        }
      } catch (e) {}

      if (eye && input) {
        eye.addEventListener('click', () => {
          const isText = input.type === 'text';
          input.type = isText ? 'password' : 'text';
          eye.textContent = isText ? '👁️' : '🙈';
        });
      }

      async function verify() {
        if (!input) return;
        const val = input.value;
        if (!val) return;
        const h = await sha256(val);
        if (h === HASH) {
          try {
            if (remember && remember.checked) {
              localStorage.setItem('lf_remember_auth', HASH);
            }
            sessionStorage.setItem('lf_authenticated', '1');
            if (IS_ADMIN) {
              localStorage.setItem('lf_admin_token', val);
            }
          } catch (e) {}
          unlock();
        } else {
          if (err) err.style.display = 'block';
          const card = document.getElementById('pwd-card');
          if (card) {
            card.classList.remove('pwd-shake');
            void card.offsetWidth;
            card.classList.add('pwd-shake');
          }
          input.value = '';
          input.focus();
        }
      }

      if (btn) btn.addEventListener('click', verify);
      const form = document.getElementById('pwd-form');
      if (form) form.addEventListener('submit', (e) => { e.preventDefault(); verify(); });
    })();
    </script>
</body>
