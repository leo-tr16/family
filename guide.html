<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#161B21">
<title>Leo Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  Leo Family — link-da-doi.html v2 · Claude · 2026-11-23
  Trang báo "không còn dùng". AG chép nội dung file này đè lên các địa chỉ cũ:
    guide.html, huong-dan-cho-me.html
  Hệ thống chỉ còn 2 link: album (./) và admin (admin.html). Không có script, không gọi API.
-->
<style>
  :root{--ink:#161B21;--gold:#F4A950;--cream:#F6E3C4;--bg:#FBF7F0;--card:#fff;--line:#ECE5D8;--muted:#5F6670}
  *{box-sizing:border-box;margin:0}
  body{font-family:"Be Vietnam Pro",Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
       min-height:100vh;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));-webkit-text-size-adjust:100%}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 24px;text-align:center}
  .logo{width:56px;height:56px;margin:0 auto 18px;border-radius:14px;background:var(--ink);display:grid;place-items:center}
  h1{font-size:21px;line-height:1.35;font-weight:700;margin-bottom:10px}
  p{font-size:16px;line-height:1.6;color:var(--muted);margin-bottom:22px}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:14px;
       font-weight:700;font-size:17px;text-decoration:none;margin-bottom:10px}
  .b1{background:var(--gold);color:var(--ink)}
  .b2{background:#F1EDE6;color:var(--ink);font-weight:600}
  .note{font-size:14px;line-height:1.55;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M3 11 12 4l9 7" fill="none" stroke="#F4A950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="15.5" r="2.2" fill="#F6E3C4"/><circle cx="12" cy="15" r="2.6" fill="#F6E3C4"/><circle cx="16.5" cy="15.7" r="1.9" fill="#F6E3C4"/></svg></div>
  <h1>Trang này không còn dùng</h1>
  <p>Xem ảnh và câu chuyện tại album.<br>Muốn góp ảnh, hãy gửi trực tiếp cho Admin.</p>
  <a class="btn b1" href="./">Xem album</a>
  <div class="note">Nếu đang mở từ icon trên màn hình chính, có thể xóa icon này.</div>
</main>
</body>
</html>
