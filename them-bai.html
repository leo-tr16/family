<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#161B21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thêm bài">
<link rel="apple-touch-icon" href="apple-touch-icon-admin.png?v=1">
<title>Leo Family Admin — Thêm bài</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Leo Family Admin — them-bai.html v1 (Mobile-first) · Claude · 2026-11-23
  Trang "Thêm bài" của Admin, mở từ nút "＋ Thêm bài" trong admin.html. Không phải link riêng.
  Gốc: guide v3 (2026-11-18). Thay guide.html / gui-anh.html (bỏ trang gửi ảnh cho người dùng cuối).
  Đăng nhập: CÙNG MẬT KHẨU với album. Mật khẩu dùng làm khóa API (localStorage "lf_admin_token",
  admin.html ghi khóa này khi đăng nhập đúng). Apps Script: TOKEN_ADMIN = mật khẩu album.
  Bài Admin đăng → status "approved" ngay (không qua bước duyệt).
  Chế độ demo (dữ liệu giả, không gọi API): mở them-bai.html?demo=1
-->
<style>
  :root{
    --ink:#161B21; --ink-2:#3A4250; --muted:#6B7280;
    --gold:#F4A950; --gold-soft:#FCEBD2; --cream:#F6E3C4;
    --bg:#FBF7F0; --card:#FFFFFF; --line:#ECE5D8;
    --ok:#2F7D4F; --ok-soft:#E3F2E8; --err:#B4232A; --err-soft:#FBE6E7;
    --r:16px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Be Vietnam Pro",Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px calc(32px + var(--safe-b))}
  [hidden]{display:none!important}

  /* Header */
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
  .link-album{font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}

  /* Nút chính */
  .btn-add{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    min-height:64px;border-radius:var(--r);background:var(--gold);color:var(--ink);font-weight:700;font-size:18px;
    box-shadow:0 6px 16px rgba(244,169,80,.35)}
  .btn-add:active{transform:scale(.99)}
  .btn-add svg{width:26px;height:26px}

  /* Section */
  .sec{margin-top:26px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
  .sec-h h2{margin:0;font-size:17px;font-weight:700}
  .sec-h .sub{font-size:13px;color:var(--muted)}

  /* Ảnh chưa gửi: lưới */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tile{position:relative;display:block;width:100%;padding:0;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--cream)}
  .tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
  .tile .vid{position:absolute;left:5px;bottom:5px;background:rgba(22,27,33,.75);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
  .tile .spin-sm{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.55)}

  /* Đã gửi: thẻ */
  .post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
  .post-thumbs{display:flex;gap:6px;margin-bottom:10px}
  .post-thumbs .tile{width:64px;flex:none}
  .post-thumbs .more{width:64px;aspect-ratio:1;border-radius:10px;background:var(--cream);display:grid;place-items:center;font-weight:700;color:var(--ink-2)}
  .post-text{font-size:15px;white-space:pre-wrap;word-break:break-word}
  .post-text.empty{color:var(--muted);font-style:italic}
  .post-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
  .badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
  .b-wait{background:var(--gold-soft);color:#8A5A14}
  .b-ok{background:var(--ok-soft);color:var(--ok)}
  .b-up{background:#EEF0F3;color:var(--ink-2)}
  .b-err{background:var(--err-soft);color:var(--err)}
  .post .edit{margin-left:auto;font-weight:600;color:var(--ink);font-size:15px;min-height:44px;min-width:44px;padding:0 10px}
  .bar{height:4px;border-radius:4px;background:#EEF0F3;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}

  .empty-box{text-align:center;color:var(--muted);padding:28px 12px;font-size:15px}
  .netbar{margin-top:12px;background:var(--err-soft);color:var(--err);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .netbar button{font-weight:700;color:var(--err)}

  /* Composer (bottom sheet toàn màn hình) */
  .sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .28s ease}
  .sheet.show{transform:none}
  .sheet-top{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;max-width:520px;width:100%;margin:0 auto}
  .sheet-top h3{margin:0;font-size:17px}
  .icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
  .icon-btn svg{width:24px;height:24px}
  .sheet-body{flex:1;overflow:auto;padding:4px 16px 16px;max-width:520px;width:100%;margin:0 auto}
  .sheet-foot{padding:10px 16px calc(12px + var(--safe-b));background:var(--bg);border-top:1px solid var(--line)}
  .sheet-foot .in{max-width:520px;margin:0 auto}

  .picked{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .picked .tile{width:96px;flex:none}
  .picked .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(22,27,33,.72);color:#fff;display:grid;place-items:center;font-size:16px;line-height:1}
  .picked .add{width:96px;flex:none;aspect-ratio:1;border-radius:10px;border:2px dashed #D9CDB8;display:grid;place-items:center;color:var(--ink-2);font-weight:600;font-size:13px;text-align:center}
  .ring{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.55);font-size:12px;font-weight:700}
  .tile.err .ring{background:rgba(180,35,42,.75);color:#fff}

  textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:14px;
    font:inherit;font-size:16px;background:var(--card);color:var(--ink);outline:none}
  textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  .lbl{font-size:14px;font-weight:600;color:var(--ink-2);margin:18px 2px 8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .date-row{display:flex;align-items:center;gap:10px}
  input[type=date]{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
  .more-inbox .grid{grid-template-columns:repeat(5,1fr)}
  .more-inbox .tile .ck{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25)}
  .more-inbox .tile.on .ck{background:var(--gold);border-color:var(--gold)}
  .more-inbox .tile.on{outline:3px solid var(--gold);outline-offset:-3px}
  .mic{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;min-height:44px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
  .mic.on{background:var(--err);border-color:var(--err);color:#fff}
  .row-between{display:flex;justify-content:space-between;align-items:center}

  .btn-send{width:100%;min-height:56px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:17px}
  .btn-send:disabled{opacity:.45}
  .foot-note{text-align:center;font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}

  /* Xem lớn */
  .viewer{position:fixed;inset:0;z-index:40;background:rgba(10,12,15,.94);display:flex;align-items:center;justify-content:center}
  .viewer img,.viewer video{max-width:100%;max-height:100%}
  .viewer .icon-btn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;color:#fff;background:rgba(255,255,255,.12)}

  /* Hộp xác nhận (thay confirm()) */
  .dlg-bg{position:fixed;inset:0;z-index:50;background:rgba(22,27,33,.45);display:flex;align-items:flex-end;justify-content:center}
  .dlg{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(16px + var(--safe-b))}
  .dlg p{margin:0 0 16px;font-size:16px}
  .dlg .b1{width:100%;min-height:52px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;margin-bottom:8px}
  .dlg .b2{width:100%;min-height:52px;border-radius:14px;background:#F1EDE6;font-weight:600}

  .toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);opacity:0;z-index:60;
    background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .spinner{width:22px;height:22px;border:3px solid #E7DCC9;border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* Màn hình mã truy cập */
  .gate{max-width:420px;margin:12vh auto 0;padding:0 20px;text-align:center}
  .gate input{width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:18px;text-align:center;margin:18px 0 10px;background:var(--card)}
  .demo-flag{position:fixed;top:6px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;z-index:70}
</style>
</head>
<body>
<div class="demo-flag" id="demoFlag" hidden>DEMO · dữ liệu giả</div>

<!-- Màn hình mã truy cập (chỉ hiện khi chưa có mã) -->
<div class="gate" id="gate" hidden>
  <div class="logo" style="width:56px;height:56px;margin:0 auto;border-radius:14px"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M3 11 12 4l9 7" fill="none" stroke="#F4A950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="15.5" r="2.2" fill="#F6E3C4"/><circle cx="12" cy="15" r="2.6" fill="#F6E3C4"/><circle cx="16.5" cy="15.7" r="1.9" fill="#F6E3C4"/></svg></div>
  <h2 style="margin:16px 0 4px">Leo Family</h2>
  <div style="color:var(--muted)">Nhập mật khẩu (giống mật khẩu album)</div>
  <input id="gateInput" type="password" autocomplete="current-password" autocapitalize="off" placeholder="Mật khẩu">
  <button class="btn-send" id="gateBtn">Tiếp tục</button>
  <div class="foot-note" id="gateMsg"></div>
</div>

<!-- Màn hình chính -->
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11 12 4l9 7" fill="none" stroke="#F4A950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="15.5" r="2.2" fill="#F6E3C4"/><circle cx="12" cy="15" r="2.6" fill="#F6E3C4"/><circle cx="16.5" cy="15.7" r="1.9" fill="#F6E3C4"/></svg></div>Leo Family</div>
    <a class="link-album" href="./admin.html">← Admin</a>
  </header>

  <input type="file" id="pick" accept="image/*,video/*" multiple hidden>
  <button class="btn-add" id="btnAdd">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Thêm ảnh / video
  </button>

  <div class="netbar" id="netbar" hidden><span id="netMsg">Không kết nối được.</span><button id="netRetry">Thử lại</button></div>

  <section class="sec" id="secInbox" hidden>
    <div class="sec-h"><h2>Ảnh chưa đăng <span id="inboxCount" style="color:var(--muted);font-weight:600"></span></h2><span class="sub">Chạm ảnh để viết lời kể</span></div>
    <div class="grid" id="inboxGrid"></div>
  </section>

  <section class="sec" id="secPosts">
    <div class="sec-h"><h2>Bài đã đăng</h2></div>
    <div id="postList"><div class="empty-box"><div class="spinner" style="margin:0 auto"></div></div></div>
  </section>
</div>

<!-- Composer -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-top">
    <button class="icon-btn" id="btnClose" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <h3 id="sheetTitle">Bài mới</h3>
    <span style="width:44px"></span>
  </div>
  <div class="sheet-body">
    <div class="picked" id="picked"></div>

    <div class="row-between">
      <div class="lbl" style="margin-top:6px">Lời kể <span style="font-weight:400;color:var(--muted)">(không bắt buộc)</span></div>
      <button class="mic" id="btnMic" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Nói</span></button>
    </div>
    <textarea id="txt" placeholder="Viết vài dòng về khoảnh khắc này…"></textarea>

    <div class="lbl">Ai trong ảnh?</div>
    <div class="chips" id="chips"></div>

    <div class="lbl">Ngày chụp</div>
    <div class="date-row"><input type="date" id="date"><span id="dateHint" style="font-size:13px;color:var(--muted)"></span></div>

    <div class="more-inbox" id="moreInbox" hidden>
      <div class="lbl">Thêm từ ảnh chưa đăng</div>
      <div class="grid" id="moreGrid"></div>
    </div>
  </div>
  <div class="sheet-foot"><div class="in">
    <button class="btn-send" id="btnSend">Đăng bài</button>
    <div class="foot-note" id="footNote"></div>
  </div></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================== CẤU HÌNH ============================== */
const API_URL = "https://script.google.com/macros/s/AKfycbwkG7OTXrAx5kMIP7c7YWt5KwO24WfW0rn1rERo0MHm8hVR0oBhwGPzzydkZRylC_mdUA/exec";            // AG điền URL Web App Apps Script v5
const ALBUM_URL = "./index.html";
const MEMBERS = [               // thứ tự hiển thị chip
  {key:"Marc",label:"Marc"},{key:"Alex",label:"Alex"},
  {key:"Ben",label:"Ben"},{key:"Tomey",label:"Tomey"},{key:"Chung",label:"Cả nhà"}];
const SINGLE_MAX = 20*1024*1024;  // > 20 MB thì tải theo từng phần
const CHUNK = 8*1024*1024;
const DEMO = /[?&]demo=1/.test(location.search) || !API_URL;

/* ============================== TIỆN ÍCH ============================== */
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => "p_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const vnDate = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };
const memberLabel = k => (MEMBERS.find(m=>m.key===k)||{label:k}).label;
let toastT; function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}

function ask(msg, okText, cancelText){
  return new Promise(res=>{
    const bg=document.createElement("div");bg.className="dlg-bg";
    bg.innerHTML=`<div class="dlg"><p>${esc(msg)}</p><button class="b1">${esc(okText)}</button><button class="b2">${esc(cancelText)}</button></div>`;
    const done=v=>{bg.remove();res(v)};
    bg.querySelector(".b1").onclick=()=>done(true);
    bg.querySelector(".b2").onclick=()=>done(false);
    bg.onclick=e=>{if(e.target===bg)done(false)};
    document.body.appendChild(bg);
  });
}

/* ============================== MẬT KHẨU ============================== */
/* Cùng mật khẩu album. admin.html lưu sẵn vào "lf_admin_token" khi đăng nhập đúng. */
const KEY="lf_admin_token";
let TOKEN = "";
try{ TOKEN=localStorage.getItem(KEY)||""; }catch(e){}
function forgetToken(){ TOKEN=""; try{localStorage.removeItem(KEY)}catch(e){} }

/* ============================== API ============================== */
async function api(action, params={}, post=false){
  if (DEMO) return mockApi(action, params);
  let res;
  if (post){
    res = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action, token:TOKEN, ...params})});
  } else {
    const q = new URLSearchParams({action, token:TOKEN, _t:Date.now(), ...params});
    res = await fetch(`${API_URL}?${q}`);
  }
  const data = await res.json();
  if (data && data.error==="unauthorized"){ forgetToken();
    showGate("Mật khẩu chưa đúng.");
    throw new Error("unauthorized"); }
  if (!data || !data.ok) throw new Error((data&&data.error)||"Lỗi máy chủ");
  return data;
}

/* ============================== TRẠNG THÁI ============================== */
let inbox = [];        // [{id,name,isVideo,date,createdAt}]
let posts = [];        // [{id,text,date,children,fileIds,files,status:'pending'|'approved', createdAt}]
const thumbs = new Map(); // fileId -> dataUrl | "none"
const localPending = new Map(); // postId -> {state:'uploading'|'error', progress}

/* ============================== TẢI DANH SÁCH ============================== */
async function loadList(silent){
  try{
    const d = await api("list");
    inbox = d.files||[];
    posts = (d.posts||[]).sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
    $("netbar").hidden = true;
    render();
    loadThumbs([...inbox.map(f=>f.id), ...posts.flatMap(p=>(p.fileIds||[]).slice(0,4))]);
  }catch(e){
    if (e.message==="unauthorized") return;
    $("netMsg").textContent = "Không kết nối được. Kiểm tra mạng rồi thử lại.";
    $("netbar").hidden = false;
    if (!silent && !posts.length) $("postList").innerHTML = "";
  }
}
$("netRetry").onclick = ()=>loadList();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && TOKEN && !sheetOpen()) loadList(true); });

async function loadThumbs(ids){
  const need = [...new Set(ids)].filter(id=>id && !thumbs.has(id));
  for (let i=0;i<need.length;i+=8){
    const batch = need.slice(i,i+8);
    batch.forEach(id=>thumbs.set(id,"loading"));
    try{
      const d = await api("thumbs",{ids:batch.join(",")});
      batch.forEach(id=>{ thumbs.set(id, (d.thumbs&&d.thumbs[id])||"none"); paintThumb(id); });
    }catch(e){ batch.forEach(id=>thumbs.delete(id)); }
  }
}
function thumbHtml(id, isVideo){
  const t = thumbs.get(id);
  const vid = isVideo?`<span class="vid">Video</span>`:"";
  if (t && t!=="none" && t!=="loading") return `<img src="${t}" alt="">${vid}`;
  if (t==="none") return `<div style="height:100%;display:grid;place-items:center;font-size:12px;color:var(--ink-2)">${isVideo?"Video":"Ảnh"}</div>`;
  return `<div class="spin-sm"><div class="spinner"></div></div>${vid}`;
}
function paintThumb(id){
  document.querySelectorAll(`[data-fid="${CSS.escape(id)}"]`).forEach(el=>{
    const isV = el.dataset.video==="1";
    const keep = el.querySelectorAll(".x,.ck,.ring");
    el.innerHTML = thumbHtml(id,isV); keep.forEach(k=>el.appendChild(k));
  });
}

/* ============================== VẼ MÀN HÌNH CHÍNH ============================== */
function render(){
  // Ảnh chưa gửi
  $("secInbox").hidden = inbox.length===0;
  $("inboxCount").textContent = inbox.length?`(${inbox.length})`:"";
  $("inboxGrid").innerHTML = inbox.map(f=>`<button class="tile" data-fid="${esc(f.id)}" data-video="${f.isVideo?1:0}" aria-label="Viết bài cho ảnh ${esc(f.name)}">${thumbHtml(f.id,f.isVideo)}</button>`).join("");
  $("inboxGrid").querySelectorAll(".tile").forEach(el=>el.onclick=()=>openComposer({fromInbox:[el.dataset.fid]}));

  // Đã gửi
  const list = $("postList");
  if (!posts.length){ list.innerHTML = `<div class="empty-box">Chưa có bài nào.<br>Bấm <b>Thêm ảnh / video</b> để bắt đầu.</div>`; return; }
  list.innerHTML = posts.map(p=>{
    const ids = p.fileIds||[]; const lp = localPending.get(p.id);
    const shown = ids.slice(0,4).map(id=>`<div class="tile" data-fid="${esc(id)}">${thumbHtml(id,false)}</div>`).join("");
    const more = ids.length>4?`<div class="more">+${ids.length-4}</div>`:"";
    let badge = p.status==="approved"?`<span class="badge b-ok">Đã đăng</span>`:`<span class="badge b-wait">Chờ duyệt</span>`;
    if (lp && lp.state==="uploading") badge = `<span class="badge b-up">Đang đăng…</span>`;
    if (lp && lp.state==="error") badge = `<span class="badge b-err">Chưa đăng được</span>`;
    const who = (p.children||[]).filter(k=>k!=="Chung"||(p.children||[]).length===1).map(memberLabel).join(", ");
    const action = lp&&lp.state==="error" ? `<button class="edit" data-retry="${esc(p.id)}">Thử lại</button>`
                 : (!lp ? `<button class="edit" data-edit="${esc(p.id)}">Sửa</button>` : "");
    return `<div class="post">
      <div class="post-thumbs">${shown}${more}</div>
      <div class="post-text ${p.text?"":"empty"}">${p.text?esc(p.text):"Không có lời kể"}</div>
      <div class="post-meta">${badge}<span>${vnDate(p.date)}${who?" · "+esc(who):""}</span>${action}</div>
      ${lp&&lp.state==="uploading"?`<div class="bar"><i style="width:${Math.round((lp.progress||0)*100)}%"></i></div>`:""}
    </div>`;
  }).join("");
  list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ const p=posts.find(x=>x.id===b.dataset.edit); if(p) openComposer({edit:p}); });
  list.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>retryPost(b.dataset.retry));
}

/* ============================== COMPOSER ============================== */
// item: {key, fileId, name, isVideo, local:{file,url}, state:'up'|'done'|'err', progress, promise}
let C = null;
const sheetOpen = () => $("sheet").classList.contains("show");

$("chips").innerHTML = MEMBERS.map(m=>`<button class="chip" data-k="${m.key}" aria-pressed="false">${m.label}</button>`).join("");
$("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true"?"false":"true"));

$("btnAdd").onclick = ()=>{ pickTarget="new"; $("pick").click(); };
let pickTarget = "new";
$("pick").onchange = async e=>{
  const files = [...e.target.files]; e.target.value="";
  if (!files.length) return;
  if (pickTarget==="new" || !C) openComposer({});
  addLocalFiles(files);
};

function openComposer({fromInbox=[], edit=null}){
  C = {editId: edit?edit.id:null, items:[], dateTouched:false, sending:false};
  $("sheetTitle").textContent = edit?"Sửa bài":"Bài mới";
  $("txt").value = edit?(edit.text||""):"";
  $("chips").querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed", edit&&(edit.children||[]).includes(b.dataset.k)?"true":"false"));
  $("date").value = edit?(edit.date||""):"";
  $("dateHint").textContent = "";
  const ids = edit?(edit.fileIds||[]):fromInbox;
  ids.forEach((id,i)=>{
    const f = inbox.find(x=>x.id===id);
    C.items.push({key:uid(), fileId:id, name:f?f.name:((edit&&edit.files&&edit.files[i])||id), isVideo:f?f.isVideo:false, state:"done", progress:1, promise:Promise.resolve()});
    if (!edit && f && f.date && !$("date").value) { $("date").value=f.date; $("dateHint").textContent="Lấy từ ảnh"; }
  });
  if (!$("date").value) $("date").value = ymd(new Date());
  $("btnSend").textContent = edit?"Lưu":"Đăng bài";
  renderPicked(); renderMoreInbox(); updateFoot();
  $("sheet").classList.add("show");
  history.pushState({sheet:1},"");
}
$("date").onchange = ()=>{ if(C){C.dateTouched=true;$("dateHint").textContent="";} };

function renderPicked(){
  const el=$("picked");
  el.innerHTML = C.items.map(it=>{
    const src = it.local ? (it.isVideo?`<video src="${it.local.url}#t=0.1" muted playsinline preload="metadata"></video><span class="vid">Video</span>`:`<img src="${it.local.url}" alt="">`) : thumbHtml(it.fileId,it.isVideo);
    const ring = it.state==="up"?`<div class="ring">${Math.round((it.progress||0)*100)}%</div>`:(it.state==="err"?`<div class="ring">Lỗi · chạm để thử lại</div>`:"");
    return `<div class="tile ${it.state==="err"?"err":""}" data-key="${it.key}" ${it.local?"":`data-fid="${esc(it.fileId)}" data-video="${it.isVideo?1:0}"`}>${src}${ring}<button class="x" aria-label="Bỏ ảnh này">×</button></div>`;
  }).join("") + `<button class="add" id="btnAddMore">＋<br>Thêm</button>`;
  el.querySelectorAll(".tile").forEach(t=>{
    const it = C.items.find(x=>x.key===t.dataset.key);
    t.querySelector(".x").onclick = ev=>{ ev.stopPropagation(); removeItem(it); };
    t.onclick = ()=>{ if(it.state==="err") startUpload(it); else openViewer(it); };
  });
  $("btnAddMore").onclick = ()=>{ pickTarget="more"; $("pick").click(); };
  C.items.filter(i=>!i.local).forEach(i=>loadThumbs([i.fileId]));
}
function renderMoreInbox(){
  const used = new Set(C.items.map(i=>i.fileId).filter(Boolean));
  const others = inbox.filter(f=>!used.has(f.id) || C.items.some(i=>i.fileId===f.id && i.fromMore));
  $("moreInbox").hidden = others.length===0 || !!C.editId;
  $("moreGrid").innerHTML = others.map(f=>{
    const on = C.items.some(i=>i.fileId===f.id);
    return `<button class="tile ${on?"on":""}" data-fid="${esc(f.id)}" data-video="${f.isVideo?1:0}">${thumbHtml(f.id,f.isVideo)}<span class="ck"></span></button>`;
  }).join("");
  $("moreGrid").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    const id=b.dataset.fid, idx=C.items.findIndex(i=>i.fileId===id);
    if (idx>=0) C.items.splice(idx,1);
    else { const f=inbox.find(x=>x.id===id); C.items.push({key:uid(),fileId:id,name:f.name,isVideo:f.isVideo,state:"done",progress:1,fromMore:true,promise:Promise.resolve()}); }
    renderPicked(); renderMoreInbox(); updateFoot();
  });
}
function removeItem(it){
  C.items = C.items.filter(x=>x!==it);
  // Ảnh mới đã tải xong vẫn nằm trong "Ảnh chưa gửi" — không mất.
  renderPicked(); renderMoreInbox(); updateFoot();
}

function addLocalFiles(files){
  files.forEach(file=>{
    const it = {key:uid(), fileId:null, name:normalizeName(file), isVideo:/^video/.test(file.type), local:{file, url:URL.createObjectURL(file)}, state:"up", progress:0};
    C.items.push(it);
    startUpload(it);
    if (!C.dateTouched) readPhotoDate(file).then(d=>{
      if(!d||!C||C.dateTouched) return;
      const cur=$("date").value; if(!cur||d<cur||$("dateHint").textContent===""){ $("date").value=d; $("dateHint").textContent="Lấy từ ảnh"; }
    });
  });
  renderPicked(); updateFoot();
}
function normalizeName(file){
  const n = file.name||"photo.jpg";
  if (/^(image|photo|video)\.\w+$/i.test(n)){
    const d=new Date(), ext=n.slice(n.lastIndexOf("."));
    return `${/^video/i.test(n)?"VID":"IMG"}_${ymd(d).replace(/-/g,"")}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${Math.random().toString(36).slice(2,5)}${ext}`;
  }
  return n;
}

/* Tải lên ngay khi chọn (như Facebook/Zalo). Ảnh đã tải lên không bao giờ mất, kể cả khi đóng bài. */
let upChain = Promise.resolve();
function startUpload(it){
  it.state="up"; it.progress=0;
  it.promise = upChain = upChain.then(()=>uploadOne(it)).catch(()=>{});
  refreshItem(it);
  return it.promise;
}
async function uploadOne(it){
  const f = it.local.file;
  try{
    let file;
    if (f.size <= SINGLE_MAX){
      it.progress=.15; refreshItem(it);
      const d = await api("upload",{name:it.name,mimeType:f.type||"",base64:await toB64(f)},true);
      file = d.file;
    } else {
      const init = await api("upload_init",{name:it.name,mimeType:f.type||"",size:f.size},true);
      const n = Math.ceil(f.size/CHUNK);
      for (let i=0;i<n;i++){
        await api("upload_chunk",{uploadId:init.uploadId,index:i,base64:await toB64(f.slice(i*CHUNK,(i+1)*CHUNK))},true);
        it.progress=(i+1)/(n+1); refreshItem(it);
      }
      file = (await api("upload_finish",{uploadId:init.uploadId},true)).file;
    }
    it.fileId=file.id; it.state="done"; it.progress=1;
    if (!inbox.some(x=>x.id===file.id)) inbox.unshift({...file, isVideo:it.isVideo});
    if (!it.isVideo && it.local) makeLocalThumb(f).then(t=>{ if(t) thumbs.set(file.id,t); });
  }catch(e){ it.state="err"; }
  refreshItem(it);
  if (!sheetOpen()) render();
}
function refreshItem(it){
  if (!C || !C.items.includes(it)) return;
  const t = document.querySelector(`.picked .tile[data-key="${it.key}"]`);
  if (!t) return;
  t.classList.toggle("err", it.state==="err");
  let r = t.querySelector(".ring");
  if (it.state==="done"){ if(r) r.remove(); }
  else { if(!r){ r=document.createElement("div"); r.className="ring"; t.insertBefore(r,t.querySelector(".x")); }
         r.textContent = it.state==="err"?"Lỗi · chạm để thử lại":`${Math.round((it.progress||0)*100)}%`; }
  updateFoot();
}
function toB64(blob){ return new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=ko; r.readAsDataURL(blob); }); }
function makeLocalThumb(file){
  return new Promise(ok=>{ const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{ const s=240, c=document.createElement("canvas"), r=Math.max(s/img.width,s/img.height);
      c.width=c.height=s; c.getContext("2d").drawImage(img,(s-img.width*r)/2,(s-img.height*r)/2,img.width*r,img.height*r);
      URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg",.75)); };
    img.onerror=()=>ok(null); img.src=u; });
}
/* Ngày chụp: EXIF DateTimeOriginal (JPEG), không có thì lấy ngày sửa file */
async function readPhotoDate(file){
  try{
    if (/jpe?g/i.test(file.type)){
      const v = new DataView(await file.slice(0,262144).arrayBuffer());
      if (v.getUint16(0)===0xFFD8){
        let o=2;
        while (o < v.byteLength-4){
          const mk=v.getUint16(o), len=v.getUint16(o+2);
          if (mk===0xFFE1 && v.getUint32(o+4)===0x45786966){
            const t=o+10, le=v.getUint16(t)===0x4949, g16=p=>v.getUint16(p,le), g32=p=>v.getUint32(p,le);
            const findTag=(ifd,tag)=>{ const n=g16(t+ifd); for(let i=0;i<n;i++){ const e=t+ifd+2+i*12; if(g16(e)===tag) return e; } return 0; };
            const ex=findTag(g32(t+4),0x8769); if(!ex) break;
            const dt=findTag(g32(ex+8),0x9003); if(!dt) break;
            const p=t+g32(dt+8); let s=""; for(let i=0;i<10;i++) s+=String.fromCharCode(v.getUint8(p+i));
            if (/^\d{4}:\d{2}:\d{2}$/.test(s)) return s.replace(/:/g,"-");
            break;
          }
          o += 2+len;
        }
      }
    }
  }catch(e){}
  return file.lastModified ? ymd(new Date(file.lastModified)) : null;
}

function updateFoot(){
  if (!C) return;
  const n=C.items.length, up=C.items.filter(i=>i.state==="up").length, err=C.items.filter(i=>i.state==="err").length;
  $("btnSend").disabled = n===0 || C.sending;
  $("footNote").textContent = n===0 ? "Chọn ít nhất 1 ảnh" : err ? `${err} ảnh chưa tải được — chạm vào ảnh để thử lại` : up ? `Đang tải ${n-up}/${n} ảnh… bạn cứ viết tiếp` : `${n} ảnh/video`;
}

async function closeComposer(fromBack){
  if (!C) return;
  const hasText = $("txt").value.trim().length>0;
  if (hasText && !C.sending){
    const ok = await ask("Bỏ bài này? Ảnh đã tải lên vẫn nằm ở mục Ảnh chưa đăng.","Bỏ bài","Viết tiếp");
    if (!ok){ if(fromBack) history.pushState({sheet:1},""); return; }
  }
  stopMic();
  $("sheet").classList.remove("show");
  C = null;
  if (!fromBack && history.state && history.state.sheet) history.back();
  render();
}
$("btnClose").onclick = ()=>closeComposer(false);
window.addEventListener("popstate",()=>{ if(sheetOpen()) closeComposer(true); });

/* Đăng bài: 1 nút. Đóng ngay, phần còn lại chạy nền với thanh tiến độ trên thẻ. */
$("btnSend").onclick = async ()=>{
  if (!C || !C.items.length) return;
  stopMic();
  const draft = {
    id: C.editId || uid(),
    text: $("txt").value.trim(),
    date: $("date").value || ymd(new Date()),
    children: [...$("chips").querySelectorAll('.chip[aria-pressed="true"]')].map(b=>b.dataset.k),
    items: C.items.slice(),
    isEdit: !!C.editId,
  };
  C.sending = true;
  $("sheet").classList.remove("show");
  if (history.state && history.state.sheet) history.back();
  C = null;
  const view = {id:draft.id,text:draft.text,date:draft.date,children:draft.children,fileIds:draft.items.map(i=>i.fileId).filter(Boolean),status:"approved",createdAt:new Date().toISOString()};
  posts = [view, ...posts.filter(p=>p.id!==draft.id)];
  pendingDrafts.set(draft.id, draft);
  await submitDraft(draft);
};
const pendingDrafts = new Map();
async function submitDraft(draft){
  localPending.set(draft.id,{state:"uploading",progress:0}); render();
  const tick = setInterval(()=>{ const done=draft.items.filter(i=>i.state==="done").length;
    localPending.get(draft.id).progress = .9*done/draft.items.length; render(); }, 400);
  try{
    await Promise.all(draft.items.map(i=>i.promise));
    if (draft.items.some(i=>i.state!=="done")) throw new Error("upload");
    const fileIds = draft.items.map(i=>i.fileId), files = draft.items.map(i=>i.name);
    const d = await api("post_save",{post:{id:draft.id,text:draft.text,date:draft.date,children:draft.children,fileIds,files}},true);
    clearInterval(tick);
    localPending.delete(draft.id); pendingDrafts.delete(draft.id);
    const saved = d.post || {id:draft.id,text:draft.text,date:draft.date,children:draft.children,fileIds,files,status:"approved",createdAt:new Date().toISOString()};
    posts = [saved, ...posts.filter(p=>p.id!==draft.id)];
    const used = new Set(fileIds); inbox = inbox.filter(f=>!used.has(f.id));
    render(); loadThumbs(fileIds);
    toast(draft.isEdit?"Đã cập nhật":"Đã đăng ✓");
  }catch(e){
    clearInterval(tick);
    localPending.set(draft.id,{state:"error"}); render();
  }
}
function retryPost(id){
  const d = pendingDrafts.get(id); if(!d) return;
  d.items.filter(i=>i.state==="err").forEach(i=>startUpload(i));
  submitDraft(d);
}
window.addEventListener("beforeunload",e=>{
  if (localPending.size || (C && C.items.some(i=>i.state==="up"))){ e.preventDefault(); e.returnValue=""; }
});

/* ============================== XEM LỚN ============================== */
async function openViewer(it){
  const v=document.createElement("div"); v.className="viewer";
  v.innerHTML=`<button class="icon-btn" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="spinner"></div>`;
  v.onclick=()=>v.remove(); document.body.appendChild(v);
  let html;
  if (it.local) html = it.isVideo?`<video src="${it.local.url}" controls autoplay playsinline></video>`:`<img src="${it.local.url}" alt="">`;
  else { try{ const d=await api("preview",{id:it.fileId}); html=d.dataUrl?`<img src="${d.dataUrl}" alt="">`:null; }catch(e){} }
  const sp=v.querySelector(".spinner"); if(sp) sp.remove();
  if (html){ v.insertAdjacentHTML("beforeend",html); const m=v.querySelector("video"); if(m) m.onclick=e=>e.stopPropagation(); }
  else v.insertAdjacentHTML("beforeend",`<div style="color:#fff">Không xem trước được</div>`);
}

/* ============================== NÓI THÀNH CHỮ ============================== */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
if (SR){ $("btnMic").hidden=false;
  $("btnMic").onclick=()=>{ if(rec){stopMic();return;}
    rec=new SR(); rec.lang="vi-VN"; rec.interimResults=true; rec.continuous=true;
    const base=$("txt").value; $("btnMic").classList.add("on"); $("btnMic").querySelector("span").textContent="Dừng";
    rec.onresult=e=>{ let s=""; for(const r of e.results) s+=r[0].transcript; $("txt").value=(base?base+" ":"")+s; };
    rec.onend=stopMic; rec.onerror=stopMic; rec.start(); };
}
function stopMic(){ if(rec){try{rec.stop()}catch(e){} rec=null;} $("btnMic").classList.remove("on"); const s=$("btnMic").querySelector("span"); if(s) s.textContent="Nói"; }

/* ============================== CỔNG MẬT KHẨU ============================== */
function showGate(msg){ $("app").hidden=true; $("gate").hidden=false; $("gateMsg").textContent=msg||""; }
$("gateBtn").onclick=()=>{ const v=$("gateInput").value.trim(); if(!v) return;
  TOKEN=v; try{localStorage.setItem(KEY,v)}catch(e){} $("gateInput").value=""; start(); };
$("gateInput").addEventListener("keydown",e=>{ if(e.key==="Enter") $("gateBtn").click(); });

function start(){ $("gate").hidden=true; $("app").hidden=false; loadList(); }

/* ============================== DEMO (dữ liệu giả) ============================== */
let MOCK=null;
function mockThumb(i){ const c=document.createElement("canvas"); c.width=c.height=240; const x=c.getContext("2d");
  const col=["#E8A0A0","#9CC3E6","#A8D5A2","#F2C27B","#C8A2D9","#8FCFC6","#E9A3C0","#BFAE9F"][i%8];
  x.fillStyle=col; x.fillRect(0,0,240,240); x.fillStyle="rgba(22,27,33,.7)"; x.font="bold 30px sans-serif"; x.textAlign="center"; x.fillText("ẢNH "+(i+1),120,130); return c.toDataURL(); }
async function mockApi(action,p){
  await new Promise(r=>setTimeout(r, action==="upload"||action==="upload_chunk"?900:250));
  if(!MOCK){ const now=Date.now(), D=864e5;
    MOCK={n:20, files:[0,1,2].map(i=>({id:"f"+i,name:`IMG_000${i}.jpg`,isVideo:i===2,date:ymd(new Date(now-(i+3)*D)),createdAt:new Date(now-D).toISOString()})),
      posts:[{id:"p1",text:"Alex lần đầu tự đứng dậy, cả nhà vỗ tay.",date:ymd(new Date(now-6*D)),children:["Alex"],fileIds:["f10","f11"],files:["a.jpg","b.jpg"],status:"pending",createdAt:new Date(now-2*D).toISOString()},
             {id:"p2",text:"",date:ymd(new Date(now-20*D)),children:["Marc","Ben"],fileIds:["f12","f13","f14","f15","f16"],files:[],status:"approved",createdAt:new Date(now-9*D).toISOString()}]}; }
  if(action==="list") return {ok:true,files:MOCK.files.filter(f=>!MOCK.posts.some(p=>p.fileIds.includes(f.id))),posts:MOCK.posts};
  if(action==="thumbs") return {ok:true,thumbs:Object.fromEntries(p.ids.split(",").map(id=>[id,mockThumb(+id.slice(1))]))};
  if(action==="preview") return {ok:true,dataUrl:mockThumb(+p.id.slice(1))};
  if(action==="upload"||action==="upload_finish"){ const id="f"+(MOCK.n++); const f={id,name:p.name||"VID.mp4",isVideo:/^video/.test(p.mimeType||""),date:ymd(new Date()),createdAt:new Date().toISOString()}; MOCK.files.unshift(f); return {ok:true,file:f}; }
  if(action==="upload_init") return {ok:true,uploadId:"u1"};
  if(action==="upload_chunk") return {ok:true};
  if(action==="post_save"){ const post={...p.post,status:"approved",createdAt:new Date().toISOString()}; MOCK.posts=[post,...MOCK.posts.filter(x=>x.id!==post.id)]; return {ok:true,post}; }
  return {ok:false,error:"unknown"};
}

/* ============================== KHỞI ĐỘNG ============================== */
if (DEMO){ $("demoFlag").hidden=false; start(); }
else if (!TOKEN) showGate();
else start();
